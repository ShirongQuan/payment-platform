extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: { }
  memory_limiter:
    check_interval: 5s
    limit_mib: 400
    spike_limit_mib: 100

connectors:
  spanmetrics:
    namespace: traces_spanmetrics
    histogram:
      explicit:
        buckets: [ 10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s ]
    dimensions:
      - name: http.method
      - name: http.status_code
    metrics_flush_interval: 15s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic

service:
  extensions: [ health_check ]
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ memory_limiter, batch ]
      exporters: [ otlp/tempo, spanmetrics, debug ]
    metrics:
      receivers: [ otlp, spanmetrics ]
      processors: [ memory_limiter, batch ]
      exporters: [ prometheus ]