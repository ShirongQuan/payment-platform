global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # Add your Spring Boot apps later when they expose /actuator/prometheus
  # Example:
  # - job_name: 'auth-service'
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets: ['host.docker.internal:9000']