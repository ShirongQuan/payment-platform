spring:
  application:
    name: ledger-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledger_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Shared consumer group for ledger projection workers.
      group-id: ledger-service
      auto-offset-reset: earliest
      # Offset commits are controlled by the listener container.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.UUIDDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # Consume only committed records from transactional producers.
        isolation.level: read_committed
    producer:
      # Used only by the DeadLetterPublishingRecoverer (KafkaConsumerConfig) to republish failed
      # records to the DLT. Must match the consumer's (de)serializer types (UUID key, String
      # value) - without this, Boot defaults to StringSerializer for the key and every DLT publish
      # throws a ClassCastException (UUID cannot be cast to String), silently dropping the record
      # even though the pre-send DLT-published metric still increments.
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      # Commit each record after handler completes.
      ack-mode: record
      missing-topics-fatal: false
      observation-enabled: true

server:
  port: 9020

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  metrics:
    tags:
      # Adds application="ledger-service" to every Micrometer meter (custom + auto-configured),
      # matching auth-service's convention - lets Grafana dashboards/queries filter/group by
      # service without relying on the Prometheus scrape "job" label.
      application: ledger-service
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      # Fraction of newly-started traces to sample (0.0-1.0). Override per-environment, e.g.
      # TRACING_SAMPLING_PROBABILITY=0.2 in production to reduce overhead/cost; keep 1.0 in
      # dev/test for full visibility. Only affects root spans - downstream services honor the
      # sampling decision propagated via the traceparent header (ParentBased sampler).
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html


#debug: true

logging:
  level:
    root: WARN
    org.example.ledger: DEBUG
    org.hibernate.SQL: ERROR
    org.hibernate.orm.jdbc.bind: ERROR
    org.flywaydb: INFO
    org.springframework.jdbc: INFO
    #    org.springframework.boot.actuate.autoconfigure.tracing: DEBUG
  #    io.opentelemetry: DEBUG
  #    io.micrometer.tracing: DEBUG
  #    org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLoggingListener: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p ${PID:- } --- [${spring.application.name:-}] [%15.15thread] [%X{traceId:-},%X{spanId:-}] [%X{correlationId:-}] %logger : %m%n"
