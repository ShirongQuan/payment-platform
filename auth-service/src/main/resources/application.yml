spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:0}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Delivery guarantees for outbox-driven publishing.
      acks: all
      retries: 5
      properties:
        # Prevent duplicate writes on producer retries.
        enable.idempotence: true
        # Bound a single send's total retry/backoff budget (including request.timeout.ms) to
        # comfortably less than outbox.publisher.claim-lease below. Otherwise a slow/retrying
        # send can still be in-flight after the claim lease expires and the row gets reclaimed
        # and re-published concurrently, causing a duplicate Kafka publish.
        delivery.timeout.ms: 20000
        request.timeout.ms: 8000
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    template:
      observation-enabled: true

outbox:
  kafka:
    topic:
      name: auth.events
  publisher:
    # Max outbox events per scheduler cycle.
    batch-size: 10
    # Delay between polling cycles.
    delay-ms: 10000ms  # 10 Seconds
    # Lease window for in-flight publish claims. Must exceed the Kafka producer's
    # delivery.timeout.ms (above) with margin, so a claim is never reclaimed while its send is
    # still legitimately in flight.
    claim-lease: 30s

idempotency:
  # Response cache retention in whole hours.
  ttl-hours: 24


server:
  port: 9000
  # Let Spring resolve client address/protocol from sanitized proxy forwarding headers.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: auth-service
    distribution:
      # Emits http_server_requests_seconds_bucket series (in addition to _count/_sum/_max),
      # required for Grafana panels using histogram_quantile(...) over http_server_requests_seconds_bucket.
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      # Fraction of newly-started traces to sample (0.0-1.0). Override per-environment, e.g.
      # TRACING_SAMPLING_PROBABILITY=0.2 in production to reduce overhead/cost; keep 1.0 in
      # dev/test for full visibility. Only affects root spans - downstream services honor the
      # sampling decision propagated via the traceparent header (ParentBased sampler).
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

#debug: true

logging:
  level:
    root: WARN
    org.example.auth: INFO
    org:
      example:
        auth:
          authorisation: DEBUG
    org.hibernate.SQL: ERROR
    org.hibernate.orm.jdbc.bind: ERROR
    # Hibernate logs every JDBC/SQL exception here itself (raw ErrorCode/SQLState + DB error text)
    # *before* Spring translates and our code catches it - including expected, safely-handled
    # ones like the concurrent-idempotency-race unique-constraint violation (see
    # ConcurrentIdempotencyRaceException / AuthorisationTransactionalExecutorImpl), which already
    # gets its own clear log.warn(...) with context. Suppress the raw duplicate to avoid noise;
    # genuinely unhandled SQL errors will still surface via the exception's own stack trace.
    org.hibernate.orm.jdbc.error: ERROR
    org.flywaydb: INFO
    org.springframework.jdbc: INFO
    #    org.springframework.boot.actuate.autoconfigure.tracing: DEBUG
  #    io.opentelemetry: DEBUG
  #    io.micrometer.tracing: DEBUG
  #    org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLoggingListener: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p ${PID:- } --- [${spring.application.name:-}] [%15.15thread] [%X{traceId:-},%X{spanId:-}] [%X{correlationId:-}] %logger : %m%n"

fraud:
  base-url: ${FRAUD_BASE_URL:http://localhost:9010}
  http:
    connect-timeout: 500ms
    read-timeout: 1000ms
  fail-open:
    enabled: false
    max-amount: 5.00
    trusted-account-ids:
      - "11111111-1111-1111-1111-111111111111"

resilience4j:
  timelimiter:
    instances:
      fraudService:
        timeoutDuration: 250ms       # abort the async call if not done in 250ms
        cancelRunningFuture: true    # also cancel/interrupt the in-flight future on timeout
  circuitbreaker:
    instances:
      fraudService:
        slidingWindowType: COUNT_BASED      # evaluate based on last N calls, not last N seconds
        slidingWindowSize: 10               # window = last 10 calls
        minimumNumberOfCalls: 5            # need at least 5 calls before evaluating failure rate
        failureRateThreshold: 50            # OPEN if >=50% of the window's calls failed
        slowCallRateThreshold: 50           # OPEN if >=50% of calls were "slow" (see below)
        slowCallDurationThreshold: 100ms    # a call counts as "slow" if it took >100ms
        waitDurationInOpenState: 15s        # stay OPEN for 10s before allowing a trial
        permittedNumberOfCallsInHalfOpenState: 3   # allow 3 trial calls in HALF_OPEN
        automaticTransitionFromOpenToHalfOpenEnabled: true  # auto-flip after 10s, no need to wait for an incoming call to trigger it