spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # Delivery guarantees for outbox-driven publishing.
      acks: all
      retries: 5
      properties:
        # Prevent duplicate writes on producer retries.
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

outbox:
  kafka:
    topic:
      name: auth.events
  publisher:
    # Max outbox events per scheduler cycle.
    batch-size: 10
    # Delay between polling cycles.
    delay-ms: 10000ms  # 10 Seconds
    # Lease window for in-flight publish claims.
    claim-lease: 30s


server:
  port: 9000
  # Let Spring resolve client address/protocol from sanitized proxy forwarding headers.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: WARN
    org.example.auth: INFO
    org:
      example:
        auth:
          authorisation: DEBUG
    org.hibernate.SQL: ERROR
    org.hibernate.orm.jdbc.bind: ERROR
    org.flywaydb: INFO
    org.springframework.jdbc: INFO

fraud:
  base-url: http://localhost:9010
  http:
    connect-timeout: 500ms
    read-timeout: 1000ms
  fail-open:
    enabled: true
    max-amount: 5.00
    trusted-account-ids:
      - "11111111-1111-1111-1111-111111111111"

resilience4j:
  timelimiter:
    instances:
      fraudService:
        timeoutDuration: 250ms
        cancelRunningFuture: true
  circuitbreaker:
    instances:
      fraudService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 300ms
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true