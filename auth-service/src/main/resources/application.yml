spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # Delivery guarantees for outbox-driven publishing.
      acks: all
      retries: 5
      properties:
        # Prevent duplicate writes on producer retries.
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

outbox:
  kafka:
    topic:
      name: auth.events
  publisher:
    # Max outbox events per scheduler cycle.
    batch-size: 10
    # Delay between polling cycles.
    delay-ms: 10000ms  # 10 Seconds
    # Lease window for in-flight publish claims.
    claim-lease: 30s


server:
  port: 9000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: WARN
    org.example.auth: INFO
    org:
      example:
        auth:
          authorisation: DEBUG
    org.hibernate.SQL: ERROR
    org.hibernate.orm.jdbc.bind: ERROR
    org.flywaydb: INFO
    org.springframework.jdbc: INFO
