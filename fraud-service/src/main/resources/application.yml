spring:
  application:
    name: fraud-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fraud_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:0}

server:
  port: 9010


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.example.fraud: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.flywaydb: INFO
    org.springframework.jdbc: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p ${PID:- } --- [${spring.application.name:-}] [%15.15thread] [%X{correlationId:-}] %-40.40logger{39} : %m%n"


risk:
  rules-version: v1.0
  decline-threshold: 70
  lock:
    enabled: true
    # Recommend locking the account after more than this many declines within the window.
    repeated-decline-threshold: 3
    repeated-decline-window-seconds: 600 # 10 minutes
    # Recommend locking immediately, regardless of decline history, at/above this score.
    high-risk-score-threshold: 90
    repeated-decline-reason-code: REPEATED_DECLINE_PATTERN
    high-risk-score-reason-code: FRAUD_HIGH_RISK_SCORE
  rules:
    velocity:
      ip:
        enabled: true
        #        threshold: 3
        #        window-seconds: 5
        threshold: 2
        window-seconds: 50
        score: 40
        reason-code: IP_VELOCITY_EXCEEDED
      account:
        enabled: true
        threshold: 2
        window-seconds: 50
        #        threshold: 5
        #        window-seconds: 30
        score: 30
        reason-code: ACCOUNT_VELOCITY_EXCEEDED
    amount-deviation:
      enabled: true
      amount-multiplier: 3
      window-days: 30
      amount-reference: 200
      min-samples: 5
      cache-ttl-minutes: 30
      score: 25
      reason-code: AMOUNT_DEVIATION
